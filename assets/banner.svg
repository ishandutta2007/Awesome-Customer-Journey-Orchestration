<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0a0d14"/></linearGradient><linearGradient id="flowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".2"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#9333ea"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><filter id="glowFilter" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1);opacity:.35}50%{transform:scale(1.18);opacity:.7}}@keyframes dashTravel{0%{stroke-dashoffset:240}}@keyframes pingNode{0%{r:5;opacity:.9}50%{r:12;opacity:.2}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.orb-pulse{animation:pulseOrb 6s ease-in-out infinite;transform-origin:center}.dash-line{stroke-dasharray:8 12;animation:dashTravel 8s linear infinite}.ping-circle{animation:pingNode 3s cubic-bezier(0,0,.2,1) infinite}.pill-floating-1{animation:floatPill 5s ease-in-out infinite}.pill-floating-2{animation:floatPill 6s ease-in-out infinite 1.5s}.pill-floating-3{animation:floatPill 5.5s ease-in-out infinite .8s}.badge-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:500}.badge-text{font-weight:600;font-size:11px}</style><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="338" x="1" y="1" fill="none" stroke="#1f2937" stroke-width="1.5" rx="15"/><circle cx="160" cy="80" r="130" fill="#4338ca" class="orb-pulse" filter="url(#glowFilter)"/><circle cx="1060" cy="240" r="150" fill="#7e22ce" class="orb-pulse" filter="url(#glowFilter)" style="animation-delay:-3s"/><circle cx="920" cy="60" r="100" fill="#0284c7" class="orb-pulse" filter="url(#glowFilter)" style="animation-delay:-1.5s"/><path fill="none" stroke="url(#flowGrad)" stroke-linecap="round" stroke-width="3" d="M 60 270 C 260 210, 380 300, 600 250 C 820 200, 940 310, 1140 250"/><path fill="none" stroke="#a855f7" stroke-linecap="round" stroke-width="2.5" d="M 60 270 C 260 210, 380 300, 600 250 C 820 200, 940 310, 1140 250" class="dash-line"/><circle cx="200" cy="245" fill="#6366f1" class="ping-circle"/><circle cx="200" cy="245" r="5" fill="#fff"/><circle cx="480" cy="275" fill="#a855f7" class="ping-circle" style="animation-delay:1s"/><circle cx="480" cy="275" r="5" fill="#fff"/><circle cx="750" cy="225" fill="#ec4899" class="ping-circle" style="animation-delay:2s"/><circle cx="750" cy="225" r="5" fill="#fff"/><circle cx="1020" cy="278" fill="#38bdf8" class="ping-circle" style="animation-delay:1.5s"/><circle cx="1020" cy="278" r="5" fill="#fff"/><g class="pill-floating-1"><rect width="150" height="28" x="90" y="42" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" opacity=".9" rx="14"/><text x="165" y="60" fill="#a5b4fc" class="badge-text" text-anchor="middle">⚡ REAL-TIME EVENTS</text></g><g class="pill-floating-2"><rect width="165" height="28" x="940" y="45" fill="#3b0764" stroke="#7e22ce" stroke-width="1.2" opacity=".9" rx="14"/><text x="1022" y="63" fill="#e9d5ff" class="badge-text" text-anchor="middle">🔄 OMNICHANNEL FLOWS</text></g><g class="pill-floating-3"><rect width="160" height="28" x="520" y="275" fill="#082f49" stroke="#0284c7" stroke-width="1.2" opacity=".9" rx="14"/><text x="600" y="293" fill="#7dd3fc" class="badge-text" text-anchor="middle">🎯 LIFECYCLE AUTOMATION</text></g><g id="foreground-content" text-anchor="middle"><text y="-28" fill="url(#accentGrad)" class="badge-text" letter-spacing="4" transform="translate(600, 115)">CURATED ECOSYSTEM &amp; MODERN GROWTH ARCHITECTURE</text><text y="30" fill="url(#textGrad)" class="title-text" filter="url(#shadow)" font-size="44" letter-spacing="-.8" transform="translate(600, 115)">Customer Journey Orchestration</text><text y="70" fill="#9ca3af" class="sub-text" font-size="17" letter-spacing=".2" transform="translate(600, 115)">High-Performance Cross-Channel SaaS Leaders &amp; Self-Hosted Open-Source Frameworks</text><g><text fill="#6b7280" class="badge-text" font-size="12" transform="translate(600, 115) translate(0, 105)"><tspan fill="#818cf8">Email</tspan> • <tspan fill="#818cf8">SMS</tspan> • <tspan fill="#c084fc">Mobile Push</tspan> • <tspan fill="#c084fc">In-App</tspan> • <tspan fill="#f472b6">WhatsApp</tspan> • <tspan fill="#38bdf8">Webhooks</tspan> • <tspan fill="#34d399">CDP &amp; Temporal Engines</tspan></text></g></g></svg>