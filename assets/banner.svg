<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Node Glow Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.18); opacity: 0.7; }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingNode {
      0% { r: 5; opacity: 0.9; }
      50% { r: 12; opacity: 0.2; }
      100% { r: 5; opacity: 0.9; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .orb-pulse { animation: pulseOrb 6s ease-in-out infinite; transform-origin: center; }
    .dash-line { stroke-dasharray: 8 12; animation: dashTravel 8s linear infinite; }
    .ping-circle { animation: pingNode 3s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .pill-floating-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatPill 6s ease-in-out infinite 1.5s; }
    .pill-floating-3 { animation: floatPill 5.5s ease-in-out infinite 0.8s; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <!-- Background Dynamic Glowing Orbs -->
  <circle cx="160" cy="80" r="130" fill="#4338ca" filter="url(#glowFilter)" class="orb-pulse" />
  <circle cx="1060" cy="240" r="150" fill="#7e22ce" filter="url(#glowFilter)" class="orb-pulse" style="animation-delay: -3s;" />
  <circle cx="920" cy="60" r="100" fill="#0284c7" filter="url(#glowFilter)" class="orb-pulse" style="animation-delay: -1.5s;" />

  <!-- Dynamic Journey Path (Curved Pipeline in Background) -->
  <path d="M 60 270 C 260 210, 380 300, 600 250 C 820 200, 940 310, 1140 250" 
        fill="none" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 60 270 C 260 210, 380 300, 600 250 C 820 200, 940 310, 1140 250" 
        fill="none" stroke="#a855f7" stroke-width="2.5" class="dash-line" stroke-linecap="round" />

  <!-- Dynamic Journey Nodes Along The Path -->
  <circle cx="200" cy="245" fill="#6366f1" class="ping-circle" />
  <circle cx="200" cy="245" r="5" fill="#fff" />

  <circle cx="480" cy="275" fill="#a855f7" class="ping-circle" style="animation-delay: 1s;" />
  <circle cx="480" cy="275" r="5" fill="#fff" />

  <circle cx="750" cy="225" fill="#ec4899" class="ping-circle" style="animation-delay: 2s;" />
  <circle cx="750" cy="225" r="5" fill="#fff" />

  <circle cx="1020" cy="278" fill="#38bdf8" class="ping-circle" style="animation-delay: 1.5s;" />
  <circle cx="1020" cy="278" r="5" fill="#fff" />

  <!-- Interactive Floating Capability Pills (Subtle, placed on sides/bottom) -->
  <g class="pill-floating-1">
    <rect x="90" y="42" width="150" height="28" rx="14" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" opacity="0.9" />
    <text x="165" y="60" fill="#a5b4fc" text-anchor="middle" class="badge-text">⚡ REAL-TIME EVENTS</text>
  </g>

  <g class="pill-floating-2">
    <rect x="940" y="45" width="165" height="28" rx="14" fill="#3b0764" stroke="#7e22ce" stroke-width="1.2" opacity="0.9" />
    <text x="1022" y="63" fill="#e9d5ff" text-anchor="middle" class="badge-text">🔄 OMNICHANNEL FLOWS</text>
  </g>

  <g class="pill-floating-3">
    <rect x="520" y="275" width="160" height="28" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="1.2" opacity="0.9" />
    <text x="600" y="293" fill="#7dd3fc" text-anchor="middle" class="badge-text">🎯 LIFECYCLE AUTOMATION</text>
  </g>

  <!-- Foreground Main Content: Kept Clean and Crisp -->
  <g id="foreground-content" transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Super-Title -->
    <text y="-28" fill="url(#accentGrad)" class="badge-text" letter-spacing="4">
      CURATED ECOSYSTEM &amp; MODERN GROWTH ARCHITECTURE
    </text>

    <!-- Main Title -->
    <text y="30" fill="url(#textGrad)" class="title-text" font-size="44" filter="url(#shadow)" letter-spacing="-0.8">
      Customer Journey Orchestration
    </text>

    <!-- Subtitle -->
    <text y="70" fill="#9ca3af" class="sub-text" font-size="17" letter-spacing="0.2">
      High-Performance Cross-Channel SaaS Leaders &amp; Self-Hosted Open-Source Frameworks
    </text>

    <!-- Mini Feature Highlights Bar -->
    <g transform="translate(0, 105)">
      <text fill="#6b7280" class="badge-text" font-size="12">
        <tspan fill="#818cf8">Email</tspan> • 
        <tspan fill="#818cf8">SMS</tspan> • 
        <tspan fill="#c084fc">Mobile Push</tspan> • 
        <tspan fill="#c084fc">In-App</tspan> • 
        <tspan fill="#f472b6">WhatsApp</tspan> • 
        <tspan fill="#38bdf8">Webhooks</tspan> • 
        <tspan fill="#34d399">CDP &amp; Temporal Engines</tspan>
      </text>
    </g>
  </g>
</svg>
